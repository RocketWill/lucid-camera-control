[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-camera-control"
version = "0.1.0"
description = "Standalone LUCID Arena camera control application"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[project.gui-scripts]
lucid-camera-control = "lucid_camera_control.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

